window.opacity = 1.0

[font]
size = 10

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Shift"

[general]
live_config_reload = true

import = ["~/.config/alacritty/aura-theme.toml"]

[cursor]
blink_interval = 500
[cursor.style]
shape = "underline"
blinking = "Always"

[terminal.shell]
program = "/usr/bin/fish"

[window.padding]
x = 20
y = 20
